schema_version: "1.0"

extension:
  id: "autopilot"
  name: "Namaste Autopilot"
  version: "1.0.0"
  description: "spec-kit 단계를 상한 있는 루프로 자동 실행하는 명령과 판정 스크립트(namaste-world 전용)"
  author: "namaste-world"
  repository: "https://github.com/Go-bugi/namaste-world"
  license: "UNLICENSED"

requires:
  speckit_version: ">=1.2.3"

provides:
  commands:
    - name: "speckit.autopilot.context"
      file: "commands/speckit.autopilot.context.md"
      description: "A1: 기존 memory에서 관련 요구사항만 골라 context.md에 쓴다"
    - name: "speckit.autopilot.clarify-ask"
      file: "commands/speckit.autopilot.clarify-ask.md"
      description: "A3: clarify 질문을 최대 5개 골라 파일로 쓴다"
    - name: "speckit.autopilot.clarify-apply"
      file: "commands/speckit.autopilot.clarify-apply.md"
      description: "A3: 파일에 적힌 답을 spec에 반영한다"
    - name: "speckit.autopilot.conflicts"
      file: "commands/speckit.autopilot.conflicts.md"
      description: "A5: 새 spec과 memory, constitution의 모순을 conflicts.md에 쓴다"
    - name: "speckit.autopilot.fix"
      file: "commands/speckit.autopilot.fix.md"
      description: "검사 결과를 보고 spec, plan, tasks 또는 코드를 고친다"
    - name: "speckit.autopilot.analyze"
      file: "commands/speckit.autopilot.analyze.md"
      description: "B3, C1: core analyze 결과를 loop/analyze.md에 쓴다"
    - name: "speckit.autopilot.test-write"
      file: "commands/speckit.autopilot.test-write.md"
      description: "B4-2: test-writer 서브에이전트로 테스트를 먼저 쓴다"
    - name: "speckit.autopilot.review"
      file: "commands/speckit.autopilot.review.md"
      description: "B6: code-writer 7단계 리뷰 결과를 loop/review.md에 쓴다"

tags:
  - "workflow"
  - "automation"
