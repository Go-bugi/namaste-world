installed:
- archive
- autopilot
- memory-loader
- reconcile
settings:
  auto_execute_hooks: true
hooks:
  after_implement:
  - extension: reconcile
    command: speckit.reconcile.run
    enabled: true
    optional: true
    priority: 20
    prompt: Did implementation surface a discovery the team accepts, or a gap the
      artifacts should record? Re-run with a feature path and a description of what
      drifted, e.g. specs/001-feature the screen shipped but is unreachable.
    description: Amend the feature's spec, plan, and tasks from a gap report
    condition: null
  after_converge:
  - extension: reconcile
    command: speckit.reconcile.run
    enabled: true
    optional: true
    priority: 20
    prompt: Did convergence surface a discovery the team accepts that the artifacts
      do not record yet? Re-run this command with a feature path and a description
      of what drifted, e.g. specs/001-feature the endpoint shipped but the plan never
      declared it.
    description: Amend the feature's spec, plan, and tasks from a gap report
    condition: null
  before_specify:
  - extension: memory-loader
    command: speckit.memory-loader.load
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.memory-loader.load?
    description: Load project memory files before specification
    condition: null
  before_plan:
  - extension: memory-loader
    command: speckit.memory-loader.load
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.memory-loader.load?
    description: Load project memory files before planning
    condition: null
  before_tasks:
  - extension: memory-loader
    command: speckit.memory-loader.load
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.memory-loader.load?
    description: Load project memory files before task generation
    condition: null
  before_implement:
  - extension: memory-loader
    command: speckit.memory-loader.load
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.memory-loader.load?
    description: Load project memory files before implementation
    condition: null
  before_clarify:
  - extension: memory-loader
    command: speckit.memory-loader.load
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.memory-loader.load?
    description: Load project memory files before clarification
    condition: null
  before_checklist:
  - extension: memory-loader
    command: speckit.memory-loader.load
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.memory-loader.load?
    description: Load project memory files before checklist generation
    condition: null
  before_analyze:
  - extension: memory-loader
    command: speckit.memory-loader.load
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.memory-loader.load?
    description: Load project memory files before analysis
    condition: null
