schema_version: "1.0"
workflow:
  id: "namaste"
  name: "Namaste autopilot"
  version: "1.0.0"
  author: "namaste-world"
  description: "spec-kit 전체 단계(specify부터 converge, archive까지)를 상한 있는 루프로 실행한다. 사람은 clarify 답, GATE-1, GATE-2에서만 개입한다."

requires:
  speckit_version: ">=1.2.3"
  integrations:
    any: ["claude", "codex"]

# 루프마다 max_iterations로 상한을 두고, 루프 바로 뒤 if 단계가 조건을 다시 본다.
# spec-kit 엔진은 상한에 닿아도 실패하지 않고 다음 단계로 넘어가기 때문이다.
# 모든 판정은 .specify/extensions/autopilot/scripts/의 셸 스크립트가 낸 JSON으로만 한다.

inputs:
  spec:
    type: string
    required: true
    prompt: "무엇을 왜 만드는지(기능 설명 또는 파일 경로)"
  plan:
    type: string
    default: ""
    prompt: "기술 방향(선택, 설명 또는 파일 경로)"
  maker:
    type: string
    default: "claude"
    enum: ["claude", "codex"]
  checker:
    type: string
    default: "codex"
    enum: ["claude", "codex"]
  clarify_verdict:
    type: string
    default: ""
  gate1_verdict:
    type: string
    default: ""
  gate2_verdict:
    type: string
    default: ""

steps:
  # ---------------------------------------------------------------- 진입
  - id: entry
    type: shell
    output_format: json
    run: "bash .specify/extensions/autopilot/scripts/entry.sh"

  # ---------------------------------------------------------------- A. 스펙
  - id: context
    command: speckit.autopilot.context
    integration: "{{ inputs.maker }}"
    capture: true
    timeout: 900
    input:
      args: "{{ inputs.spec }}"

  - id: specify
    command: speckit.specify
    integration: "{{ inputs.maker }}"
    capture: true
    timeout: 900
    input:
      args: "{{ inputs.spec }}"

  - id: feature
    type: shell
    output_format: json
    run: "bash .specify/extensions/autopilot/scripts/check.sh specify"

  # A3 clarify: 최대 3라운드. 한 라운드에서 해결된 답이 0개면 멈춘다.
  - id: clarify-loop
    type: do-while
    max_iterations: 3
    condition: "{{ steps.clarify-state.output.data.again }}"
    steps:
      - id: clarify-ask
        command: speckit.autopilot.clarify-ask
        integration: "{{ inputs.maker }}"
        capture: true
        timeout: 900
      - id: clarify-asked
        type: shell
        output_format: json
        run: "bash .specify/extensions/autopilot/scripts/check.sh clarify-ask"
      - id: clarify-has-questions
        type: if
        condition: "{{ steps.clarify-asked.output.data.questions > 0 }}"
        then:
          - id: clarify-answer
            type: gate
            message: "clarify 질문 파일에 답을 적은 뒤 answered를 고릅니다. 답하지 않은 질문은 GATE-1에 남은 항목으로 보입니다."
            show_file: "{{ steps.clarify-asked.output.data.file }}"
            options: ["answered", "skip"]
            verdict_input: clarify_verdict
            on_reject: skip
          - id: clarify-apply
            command: speckit.autopilot.clarify-apply
            integration: "{{ inputs.maker }}"
            capture: true
            timeout: 900
      - id: clarify-state
        type: shell
        output_format: json
        run: "bash .specify/extensions/autopilot/scripts/check.sh clarify"

  # A4 checklist: 테스트 가능성 점검. 최대 2회. 남은 항목은 GATE-1에 보인다.
  - id: checklist-loop
    type: do-while
    max_iterations: 2
    condition: "{{ steps.checklist-state.output.data.again }}"
    steps:
      - id: checklist
        command: speckit.checklist
        integration: "{{ inputs.maker }}"
        capture: true
        timeout: 900
        input:
          args: "testability: 이 spec만 보고 다른 사람이 테스트를 쓸 수 있는지 점검한다. 파일 이름은 checklists/testability.md로 하고 이미 있으면 새로 쓴다. 질문하지 말고 바로 만든다. 각 항목에 [Gap], [Ambiguity], [Conflict] 중 해당 표시를 붙인다."
      - id: checklist-state
        type: shell
        output_format: json
        run: "bash .specify/extensions/autopilot/scripts/check.sh checklist"
      - id: checklist-needs-fix
        type: if
        condition: "{{ steps.checklist-state.output.data.again }}"
        then:
          - id: checklist-fix
            command: speckit.autopilot.fix
            integration: "{{ inputs.maker }}"
            capture: true
            timeout: 900
            input:
              args: "checklist"

  # A5 충돌 검사: checker가 본다. 최대 2회. 남은 모순은 GATE-1에 보인다.
  - id: conflicts-loop
    type: do-while
    max_iterations: 2
    condition: "{{ steps.conflicts-state.output.data.again }}"
    steps:
      - id: conflicts
        command: speckit.autopilot.conflicts
        integration: "{{ inputs.checker }}"
        capture: true
        timeout: 900
      - id: conflicts-state
        type: shell
        output_format: json
        run: "bash .specify/extensions/autopilot/scripts/check.sh conflicts"
      - id: conflicts-needs-fix
        type: if
        condition: "{{ steps.conflicts-state.output.data.again }}"
        then:
          - id: conflicts-fix
            command: speckit.autopilot.fix
            integration: "{{ inputs.maker }}"
            capture: true
            timeout: 900
            input:
              args: "conflicts"

  # GATE-1: approve면 다음으로. edit(직접 수정)와 reject(피드백으로 수정)는 합쳐 3번까지.
  - id: gate1-loop
    type: do-while
    max_iterations: 3
    condition: "{{ steps.gate1.output.choice != 'approve' }}"
    steps:
      - id: gate1-summary
        type: shell
        output_format: json
        run: "bash .specify/extensions/autopilot/scripts/check.sh gate1"
      - id: gate1
        type: gate
        message: "spec을 검토합니다. approve, edit(spec.md를 직접 고침), reject(loop/gate1-feedback.md에 고칠 점을 적음) 중에서 고릅니다."
        show_file: "{{ steps.gate1-summary.output.data.file }}"
        options: ["approve", "edit", "reject"]
        verdict_input: gate1_verdict
        on_reject: skip
      - id: gate1-rejected
        type: if
        condition: "{{ steps.gate1.output.choice == 'reject' }}"
        then:
          - id: gate1-fix
            command: speckit.autopilot.fix
            integration: "{{ inputs.maker }}"
            capture: true
            timeout: 900
            input:
              args: "gate1"
      - id: gate1-recheck
        type: if
        condition: "{{ steps.gate1.output.choice != 'approve' }}"
        then:
          - id: gate1-checklist
            command: speckit.checklist
            integration: "{{ inputs.maker }}"
            capture: true
            timeout: 900
            input:
              args: "testability: 이 spec만 보고 다른 사람이 테스트를 쓸 수 있는지 점검한다. 파일 이름은 checklists/testability.md로 하고 이미 있으면 새로 쓴다. 질문하지 말고 바로 만든다. 각 항목에 [Gap], [Ambiguity], [Conflict] 중 해당 표시를 붙인다."
          - id: gate1-checklist-state
            type: shell
            output_format: json
            run: "bash .specify/extensions/autopilot/scripts/check.sh checklist"
          - id: gate1-conflicts
            command: speckit.autopilot.conflicts
            integration: "{{ inputs.checker }}"
            capture: true
            timeout: 900
          - id: gate1-conflicts-state
            type: shell
            output_format: json
            run: "bash .specify/extensions/autopilot/scripts/check.sh conflicts"

  - id: gate1-exhausted
    type: if
    condition: "{{ steps.gate1.output.choice != 'approve' }}"
    then:
      - id: gate1-abort
        type: shell
        run: "bash .specify/extensions/autopilot/scripts/halt.sh 'ABORT: GATE-1에서 3번 승인되지 않았습니다' 'spec 방향을 다시 정한 뒤 새 기능 설명으로 처음부터 실행합니다.'"

  # ---------------------------------------------------------------- B. 설계와 구현
  - id: plan
    command: speckit.plan
    integration: "{{ inputs.maker }}"
    capture: true
    timeout: 900
    input:
      args: "{{ inputs.plan }}"

  - id: plan-state
    type: shell
    output_format: json
    run: "bash .specify/extensions/autopilot/scripts/check.sh plan"

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.maker }}"
    capture: true
    timeout: 900

  - id: tasks-state
    type: shell
    output_format: json
    run: "bash .specify/extensions/autopilot/scripts/check.sh tasks"

  # B3 analyze: checker가 보고 maker가 고친다. 최대 3회. 진전 없음이나 퇴행이면 바로 끝낸다.
  - id: analyze-loop
    type: do-while
    max_iterations: 3
    condition: "{{ steps.analyze-state.output.data.again }}"
    steps:
      - id: analyze
        command: speckit.autopilot.analyze
        integration: "{{ inputs.checker }}"
        capture: true
        timeout: 900
      - id: analyze-state
        type: shell
        output_format: json
        run: "bash .specify/extensions/autopilot/scripts/check.sh analyze"
      - id: analyze-needs-fix
        type: if
        condition: "{{ steps.analyze-state.output.data.again }}"
        then:
          - id: analyze-fix
            command: speckit.autopilot.fix
            integration: "{{ inputs.maker }}"
            capture: true
            timeout: 900
            input:
              args: "analyze"

  - id: analyze-exhausted
    type: if
    condition: "{{ steps.analyze-state.output.data.pass == false }}"
    then:
      - id: analyze-halt
        type: shell
        run: "bash .specify/extensions/autopilot/scripts/halt.sh 'analyze의 CRITICAL, HIGH가 남았습니다(상한 3회, 진전 없음, 퇴행 중 하나)' 'loop/analyze.md를 보고 spec, plan, tasks를 고친 뒤 새로 실행합니다.'"

  # B4-1 모델링: 본문 없는 시그니처만 만든다.
  - id: model
    command: speckit.implement
    integration: "{{ inputs.maker }}"
    capture: true
    timeout: 900
    input:
      args: "[autopilot] Phase 1 (Modeling) 작업만 한다. 본문은 TS는 throw new Error('not implemented'), Rust는 todo!()로 둔다. 다른 Phase는 하지 않는다."

  - id: model-state
    type: shell
    output_format: json
    run: "bash .specify/extensions/autopilot/scripts/check.sh model"

  # B4-2 테스트: checker가 띄운 test-writer 서브에이전트가 쓴다. red가 아니면 최대 2회 다시 쓴다.
  - id: tests-loop
    type: do-while
    max_iterations: 2
    condition: "{{ steps.tests-state.output.data.again }}"
    steps:
      - id: test-bundle
        type: shell
        output_format: json
        run: "bash .specify/extensions/autopilot/scripts/bundle.sh"
      - id: test-write
        command: speckit.autopilot.test-write
        integration: "{{ inputs.checker }}"
        capture: true
        timeout: 1200
      - id: tests-state
        type: shell
        output_format: json
        timeout: 1200
        run: "bash .specify/extensions/autopilot/scripts/check.sh tests"

  - id: tests-exhausted
    type: if
    condition: "{{ steps.tests-state.output.data.red == false }}"
    then:
      - id: tests-halt
        type: shell
        run: "bash .specify/extensions/autopilot/scripts/halt.sh '테스트가 red가 아닙니다(2회). 컴파일 오류, 범위 밖 수정, 본문 없이 통과하는 테스트 중 하나' 'loop/tests.json과 loop/tests.log를 보고 contracts를 보강한 뒤 새로 실행합니다.'"

  # B5~B7: 구현 → 검증 루프(최대 5회) → converge. converge가 작업을 추가하면 최대 3번 다시 돈다.
  - id: build-loop
    type: do-while
    max_iterations: 3
    condition: "{{ steps.converge-state.output.data.again }}"
    steps:
      - id: implement
        command: speckit.implement
        integration: "{{ inputs.maker }}"
        capture: true
        timeout: 1800
        input:
          args: "[autopilot] Phase 1, 2는 끝났다. 남은 열린 작업을 순서대로 한다. 테스트 파일은 고치지 않는다."
      - id: verify-loop
        type: do-while
        max_iterations: 5
        condition: "{{ steps.verify-state.output.data.again }}"
        steps:
          - id: verify-run
            type: shell
            output_format: json
            timeout: 1800
            run: "bash .specify/extensions/autopilot/scripts/verify.sh"
          - id: verify-passed
            type: if
            condition: "{{ steps.verify-run.output.data.count == 0 }}"
            then:
              - id: review
                command: speckit.autopilot.review
                integration: "{{ inputs.checker }}"
                capture: true
                timeout: 900
          - id: verify-state
            type: shell
            output_format: json
            run: "bash .specify/extensions/autopilot/scripts/check.sh verify"
          - id: verify-needs-fix
            type: if
            condition: "{{ steps.verify-state.output.data.again }}"
            then:
              - id: verify-fix
                command: speckit.autopilot.fix
                integration: "{{ inputs.maker }}"
                capture: true
                timeout: 1800
                input:
                  args: "verify"
      - id: verify-exhausted
        type: if
        condition: "{{ steps.verify-state.output.data.pass == false }}"
        then:
          - id: verify-halt
            type: shell
            run: "bash .specify/extensions/autopilot/scripts/halt.sh '검증이 통과하지 않았습니다(상한 5회, 진전 없음, 퇴행 중 하나)' 'loop/verify-run.json, loop/verify/, loop/review.md를 보고 고친 뒤 새로 실행합니다.'"
      - id: converge
        command: speckit.converge
        integration: "{{ inputs.maker }}"
        capture: true
        timeout: 900
      - id: converge-state
        type: shell
        output_format: json
        run: "bash .specify/extensions/autopilot/scripts/check.sh converge"

  - id: build-exhausted
    type: if
    condition: "{{ steps.converge-state.output.data.converged == false }}"
    then:
      - id: build-halt
        type: shell
        run: "bash .specify/extensions/autopilot/scripts/halt.sh 'converge 3회 뒤에도 열린 작업이 남았습니다' 'tasks.md의 열린 작업을 보고 spec 범위를 줄이거나 나눈 뒤 새로 실행합니다.'"

  # ---------------------------------------------------------------- C. 마무리
  - id: final-analyze
    command: speckit.autopilot.analyze
    integration: "{{ inputs.checker }}"
    capture: true
    timeout: 900

  - id: final-analyze-state
    type: shell
    output_format: json
    run: "bash .specify/extensions/autopilot/scripts/check.sh analyze"

  - id: final-analyze-failed
    type: if
    condition: "{{ steps.final-analyze-state.output.data.pass == false }}"
    then:
      - id: final-analyze-halt
        type: shell
        run: "bash .specify/extensions/autopilot/scripts/halt.sh '최종 analyze에 CRITICAL, HIGH가 있습니다' 'loop/analyze.md를 보고 고친 뒤 새로 실행합니다.'"

  # GATE-2: 사람이 reconcile과 archive를 대화형으로 실행한 뒤 승인한다. 감사가 통과할 때까지 최대 3번.
  - id: gate2-loop
    type: do-while
    max_iterations: 3
    condition: "{{ steps.audit.output.data.again }}"
    steps:
      - id: gate2
        type: gate
        message: "자기 에이전트에서 /speckit-reconcile-run <기능 디렉터리>, /speckit-archive-run <기능 디렉터리>를 대화형으로 실행하고(Codex는 $speckit-...), 질문에 답한 뒤 done을 고릅니다. 다시 돌아왔다면 loop/audit.json의 missing ID를 확인합니다."
        options: ["done", "abort"]
        verdict_input: gate2_verdict
        on_reject: abort
      - id: audit
        type: shell
        output_format: json
        run: "bash .specify/extensions/autopilot/scripts/audit.sh"

  - id: audit-failed
    type: if
    condition: "{{ steps.audit.output.data.pass == false }}"
    then:
      - id: audit-halt
        type: shell
        run: "bash .specify/extensions/autopilot/scripts/halt.sh '병합 감사 3회 실패: 기능 spec의 FR이 memory에 없습니다' 'loop/audit.json의 missing ID를 보고 archive를 다시 실행합니다.'"

  - id: done
    type: shell
    run: "echo 'DONE: 코드, 테스트, .specify/memory 변경을 커밋하고 pr 스킬로 PR을 올립니다.'"
