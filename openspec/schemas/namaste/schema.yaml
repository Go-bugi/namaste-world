name: namaste
version: 1
description: namaste-world 워크플로 - proposal → specs → clarify → plan → 승인 → implement → verify → archive
artifacts:
  - id: proposal
    generates: proposal.md
    description: 왜 바꾸는지와 영향 범위를 적은 제안서
    template: proposal.md
    instruction: |
      이 변경이 **왜** 필요한지 정하는 제안서를 씁니다.

      섹션:
      - **Why**: 해결할 문제나 기회를 1~2문장으로 씁니다.
      - **What Changes**: 바뀌는 점을 목록으로 씁니다. 기존 동작을 깨는 변경에는 **BREAKING**을 붙입니다.
      - **Capabilities**: 만들거나 바꿀 capability를 적습니다.
        - capability 경로는 도메인 코드의 소문자입니다(예: `AGENT` → `agent`). 도메인 코드는 영어 대문자 2~6자로 기능 영역을 나타냅니다.
        - **New Capabilities**: 새로 만드는 capability. 각각 `specs/<capability>/spec.md`가 됩니다.
        - **Modified Capabilities**: 요구사항이 바뀌는 기존 capability. `openspec/specs/` 아래 경로를 그대로 씁니다. 구현만 바뀌고 요구사항이 그대로면 적지 않습니다.
      - **Impact**: 영향받는 코드 영역(`src/renderer`, `src-tauri`의 어느 층), 의존성, 다른 기능.

      Capabilities를 채우기 전에 기존 스펙을 확인합니다.
      `openspec list --specs`로 capability 목록을 보고, 관련 있어 보이는 것은
      `openspec show "<spec-id>" --type spec`으로 시나리오까지 읽습니다.
      비슷한 이름의 capability를 새로 만들지 말고 기존 경로를 씁니다.

      요구사항이 바뀌지 않는 변경(리팩터링, 도구, 문서)은 `.openspec.yaml`에
      `skip_specs: true`를 적습니다. 검사를 통과시키려고 요구사항을 지어내지 않습니다.

      1~2쪽 안으로 씁니다. "어떻게"는 plan.md에 씁니다.
    requires: []

  - id: specs
    generates: 'specs/**/*.md'
    description: 무엇을 해야 하는지 적은 delta 스펙
    template: spec.md
    instruction: |
      시스템이 **무엇을** 해야 하는지 정하는 delta 스펙을 씁니다.
      스펙은 동작의 약속입니다. 구현 계획이 아닙니다.

      쓸 것: 사용자나 다른 시스템이 기대하는 관찰 가능한 동작, 입력과 출력과 에러 조건,
      외부 제약(보안, 개인정보, 신뢰성, 호환성), 테스트로 확인할 수 있는 시나리오.
      쓰지 않을 것: 함수와 타입 이름, 라이브러리 선택, 구현 순서(plan.md에 씀).

      proposal의 Capabilities에 적은 capability마다 `specs/<capability>/spec.md`를 하나씩 씁니다.
      기존 capability를 바꿀 때는 `openspec list --specs`로 경로를 확인한 뒤 같은 경로를 씁니다.
      파일은 하나씩 쓰고 바로 저장합니다. 이미 있는 파일은 사용자가 요청할 때만 다시 씁니다.

      Delta 섹션(`##` 제목, 영어 그대로):
      - `## ADDED Requirements`: 새 요구사항
      - `## MODIFIED Requirements`: 바뀐 요구사항. 기존 블록 전체(`### Requirement:`부터 모든 시나리오까지)를 복사해 고칩니다. 제목은 기존과 글자 그대로 같아야 합니다.
      - `## REMOVED Requirements`: 지운 요구사항. `**Reason**`과 `**Migration**`을 적습니다.
      - `## RENAMED Requirements`: 이름만 바뀐 요구사항. `FROM:`/`TO:` 형식입니다.

      요구사항 ID:
      - 기능 요구사항(Functional Requirement)은 `### Requirement: FR-<도메인>-NNN <이름>`, 성공 기준(Success Criteria)은 `### Requirement: SC-<도메인>-NNN <이름>`으로 씁니다. 예: `### Requirement: FR-AGENT-001 설치된 에이전트 감지`
      - 번호는 그 도메인에서 쓴 적 없는 다음 번호입니다. `openspec/specs/`와 `openspec/changes/archive/`에 나온 ID는 지워졌더라도 다시 쓰지 않습니다.
      - 요구사항 하나에는 동작 하나만 적습니다. 설명은 500자 이하로 쓰고 예시와 경계 조건은 시나리오로 옮깁니다.

      형식(어기면 `openspec validate --strict`가 실패합니다):
      - 규범 문장에는 SHALL 또는 MUST를 씁니다(본문은 한국어, 키워드만 영어).
      - 요구사항마다 시나리오가 하나 이상 있어야 합니다. 시나리오 제목은 정확히 `####` 네 개입니다.
      - 시나리오에는 `- **WHEN**`(또는 GIVEN)과 `- **THEN**` 줄이 모두 있어야 합니다.
      - 새 capability의 delta만 첫 섹션으로 `## Purpose`(50자 이상)를 둡니다. 기존 capability의 delta에는 두지 않습니다.

      다 쓰면 `openspec validate <change> --strict`를 돌려 통과시킵니다.
    requires:
      - proposal

  - id: clarify
    generates: clarify.md
    description: 스펙 충돌과 모호한 점을 사람에게 묻고 답을 기록한 파일
    template: clarify.md
    instruction: |
      구현 전에 스펙의 충돌과 모호한 점을 찾아 사람에게 묻고, 답을 delta에 반영합니다.

      1. 충돌을 찾습니다.
         - `node scripts/sdd-state.mjs <change>` 출력의 `conflicts`를 봅니다. 다른 진행 중인 변경이 같은 capability나 ID를 건드리거나, 이미 쓴 ID를 다시 쓴 경우가 여기에 나옵니다. 하나도 빠짐없이 질문으로 올립니다.
         - delta가 건드리는 capability의 기준 스펙(`openspec show "<capability>" --type spec`)을 읽고, `ADDED`로 적은 요구사항 중 기존 요구사항과 모순되는 것을 찾습니다. 모순이면 "기존 요구사항을 MODIFIED/REMOVED로 바꿀지, 새 요구사항을 고칠지" 묻습니다.
      2. 모호한 점을 찾습니다. 시나리오만 보고 테스트를 쓸 수 없는 곳(수치, 시간 제한, 실패할 때의 동작, 화면 문구의 범위)을 고릅니다. 답에 따라 스펙이나 구현이 달라지는 것만 묻습니다.
      3. 질문은 한 라운드에 최대 5개입니다. 템플릿 형식대로 `clarify.md`에 쓰고, `context`의 "사람에게 묻기" 규칙대로 그 자리에서 묻습니다.
      4. 받은 답을 각 질문의 `**답**:` 줄에 적고, 같은 내용을 delta 스펙에 반영합니다. 반영한 뒤 `openspec validate <change> --strict`를 다시 통과시킵니다.
      5. 물을 것이 없으면 그 라운드 제목 아래에 "질문 없음: <근거>" 한 줄만 적습니다.
      6. 라운드의 모든 질문에 답(보류 포함)을 받고 delta에 반영했으면, 라운드 맨 끝에 `spec-hash: <값>`을 적습니다. 값은 `node scripts/sdd-state.mjs <change> --hash spec`의 출력입니다. 답이 빈 질문이 남아 있으면 적지 않습니다.

      상태 판정의 `missing`이 "clarify 뒤에 delta가 바뀌었습니다"이면, 앞 라운드 뒤에 delta가 바뀐 것입니다.
      새 라운드를 열고 바뀐 요구사항에서 새로 생긴 충돌과 모호한 점만 묻습니다.

      다시 하기(`sdd-next clarify`): proposal 이후 archive 전이면 어느 상태에서든 다시 할 수 있습니다.
      - 기존 질문과 답은 지우지 않습니다. `clarify.md` 끝에 `## 질문 (라운드 N)`을 덧붙이고, 질문 번호는 앞 라운드에 이어서 매깁니다.
      - 이미 답한 내용을 다시 묻지 않습니다. 그 뒤에 바뀐 delta, plan, 다른 변경의 `conflicts`에서 새로 생긴 것만 묻습니다.
      - 찾은 것이 없으면 "질문 없음: <근거>"와 `spec-hash:`만 덧붙입니다. 그러면 상태는 바뀌지 않습니다.
      - 답 때문에 delta를 고치면 `spec-hash`가 바뀌어, 다음 `sdd-next`가 plan 수정과 다시 승인으로 차례대로 돌아갑니다. 승인 표시를 손으로 지우지 않습니다.
    requires:
      - specs

  - id: plan
    generates: plan.md
    description: 어떻게 만들지(설계)와 어떤 순서로 할지(작업 체크리스트)
    template: plan.md
    instruction: |
      스펙을 **어떻게** 만들고 **어떤 순서로** 할지 정합니다. 앞부분은 설계, 뒷부분은 작업 체크리스트입니다.
      코드 규칙은 `AGENTS.md`("구조", "폴더 구조", "Rust와 TS 타입 맞추기")와 `code-writer`, `fp-apply` 스킬을 따릅니다.
      설계가 이 규칙과 다르면 안 됩니다.

      ## 설계
      - **층 배치**: 이번 변경이 건드리는 층(core, store, React, 3D, IO, 빌드와 앱 설정)과 각 파일 위치. 계산(core)은 `domain/`이나 `shared/lib/`에, 사이드 이펙트는 `api/`, Rust `commands/` 등에 둡니다.
      - **타입과 경계**: Rust↔TS로 주고받는 타입(ts-rs), 새 Rust 명령, 이벤트 이름과 payload, capability 권한.
      - **시그니처**: 테스트할 공개 함수와 Rust 명령의 시그니처를 코드 블록으로 적습니다. 입력과 출력의 의미, 에러 경우를 함께 적습니다. `test-writer`는 이 절과 delta만 보고 테스트를 씁니다.
      - **결정**: 고른 방법과 이유. 다른 선택지를 버린 이유는 한 줄로만 적습니다.
      - **위험**: `[위험] → 대응` 형식.
      스펙을 바꿔야 하는 미결 사항이 있으면 계획을 쓰기 전에 사람에게 묻습니다. 가정을 계획에 숨기지 않습니다.
      스펙을 고쳐야 하면 `context`의 "앞 단계로 돌아가기"를 따릅니다. 이때 plan은 끝내지 않고 멈춥니다.

      맨 위 제목 아래에 `spec-hash: <값>`을 적습니다. 값은 `node scripts/sdd-state.mjs <change> --hash spec`의 출력입니다.
      상태 판정의 `missing`이 "plan 뒤에 delta가 바뀌었습니다"이면, 바뀐 요구사항에 맞춰 설계와 작업을 고치고 `spec-hash`를 새 값으로 바꿉니다.
      이미 `[x]`인 작업 가운데 바뀐 요구사항 때문에 다시 해야 하는 것은 `[ ]`로 되돌립니다.

      ## 작업
      - 체크박스 형식만 진행 상황으로 셉니다: `- [ ] N.M 설명 (FR-XXX-NNN)`. `x`만 든 칸이 완료입니다.
      - 작업마다 관련 `FR-`/`SC-` ID를 괄호로 적습니다. 스펙에 없는 동작은 작업으로 넣지 않습니다. 필요하면 스펙을 먼저 고칩니다.
      - 작업마다 완료를 확인하는 방법(테스트, 명령, 관찰할 동작)을 적습니다.
      - 관련 작업을 `### N. 그룹 이름`으로 묶고 의존 순서대로 둡니다. 그룹마다 그 그룹이 필요한 테스트를 함께 둡니다.
      - 사용자에게 보이는 연결(버튼, 메뉴, 라우트)은 마지막 그룹에 둡니다.
      - 작업 하나는 한 세션에 끝낼 수 있는 크기로 나눕니다.
    requires:
      - clarify

apply:
  requires: [plan]
  tracks: plan.md
  instruction: |
    사람이 승인한 변경만 구현합니다. 상태 판정이 implement나 verify가 아니면 구현하지 않습니다.
    구현 중에 delta나 plan 설계를 고쳐야 하면 `context`의 "앞 단계로 돌아가기"를 따릅니다. 고친 뒤에는 상태 판정이 clarify, plan, 승인 순서로 되돌립니다.

    ## implement
    아래 순서를 지킵니다.

    1. **시그니처**: plan.md "시그니처"의 함수와 명령을 본문 없이 만듭니다(TS는 `throw new Error('TODO')`, Rust는 `todo!()`). 이미 있으면 건너뜁니다.
    2. **테스트 먼저**: `test-writer` 서브에이전트를 부릅니다. 넘기는 것은 변경 폴더 경로뿐입니다. test-writer는 delta 스펙과 plan.md의 "설계"만 읽고 테스트를 씁니다. 이 단계는 core(순수 함수)를 새로 만들거나 바꿀 때 반드시 합니다. 새 테스트가 지금 실패하는지 확인합니다.
       - test-writer가 `test-questions.md`에 질문을 남기면(`### TQN. <질문>`과 `**답**:` 줄 형식) `context`의 "사람에게 묻기" 규칙대로 묻고 답을 적은 뒤 test-writer를 다시 부릅니다. 답이 빈 질문이 남으면 상태 판정이 implement에서 넘어가지 않습니다.
       - 답이 스펙을 바꾸면 delta를 고치고 멈춥니다(앞 단계로 돌아가기). 설계만 바꾸면 plan.md "설계"를 고칩니다. 설계를 고치면 승인 해시가 바뀌어 다시 승인을 받습니다.
    3. **구현**: `code-writer` 스킬 절차로 plan.md의 작업을 순서대로 구현합니다. 작업 하나를 끝낼 때마다 바로 `- [x]`로 바꿉니다.
       - 구현하는 쪽은 테스트 파일을 고치지 않습니다. 테스트가 스펙과 다르다고 보면 근거를 `test-disputes.md`에 적고, test-writer를 다시 불러 판정받습니다.
       - 스펙에 없는 동작이 필요하면 멈추고 사람에게 알립니다.
    세션이 끊겨도 plan.md의 체크박스로 이어서 합니다.

    ## verify
    모든 작업이 `[x]`가 되면 완료를 판정합니다. 이 단계에서는 코드를 고치지 않습니다.
    1. PR CI와 같은 명령을 이 순서로 돌립니다: `pnpm format:check:rust`, `pnpm lint:rust`, `pnpm test:rust`, `pnpm format:check`, `pnpm lint`, `pnpm test`, `pnpm build`.
    2. delta의 모든 `FR-`/`SC-` ID가 plan.md 작업과 테스트 제목(TS는 `FR-TRAY-001`, Rust 함수 이름은 `fr_tray_001_`) 중 하나 이상에 나오는지 확인합니다.
    3. `openspec/schemas/namaste/templates/verify.md` 형식으로 변경 폴더에 `verify.md`를 씁니다. 마지막 줄은 `node scripts/sdd-state.mjs <change> --hash plan`이 출력한 값으로 `plan-hash: <값>`을 적습니다.
    4. 모두 통과하면 `결과: 통과`, 하나라도 실패하면 `결과: 실패`로 적습니다. 실패하면 plan.md 끝에 `### 수정` 그룹을 만들고 실패마다 `- [ ]` 작업을 추가합니다. 그러면 다음 `sdd-next`가 implement로 돌아갑니다.
    검사를 통과시키려고 설정을 끄거나 테스트를 지우지 않습니다.
