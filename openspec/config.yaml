schema: namaste

# 모든 산출물을 쓸 때 함께 읽는 프로젝트 원칙. 단계별 절차는 schemas/namaste/schema.yaml에 있다.
context: |
  저장소: namaste-world. Tauri 2 데스크톱 앱(화면은 React + R3F, OS 기능은 Rust).

  언어와 문체
  - 산출물 본문은 한국어로 쓴다. `korean-tech-writing` 스킬의 문체(습니다체)를 따른다.
  - OpenSpec이 파싱하는 제목(`## ADDED Requirements`, `### Requirement:`, `#### Scenario:`, `## Why` 등)과 SHALL/MUST, WHEN/THEN은 영어 그대로 둔다.

  원칙
  1. 코드 규칙은 저장소 문서를 따른다. 절차는 `code-writer` 스킬, 계산과 사이드 이펙트를 나누는 기준과 테스트 방식은 `fp-apply` 스킬, 폴더 위치와 Tauri 경계, CSP, 빌드 타깃 제약은 `AGENTS.md`에 있다. 산출물에 이 규칙을 옮겨 적지 않고 가리키기만 한다.
  2. 테스트는 구현보다 먼저, 구현을 모르는 쪽이 쓴다. core(순수 함수)를 새로 만들거나 바꾸면 `test-writer` 서브에이전트가 delta와 plan의 설계만 보고 테스트를 먼저 쓴다. 구현하는 쪽은 테스트 파일을 고치지 않는다.
  3. 기존 스펙을 읽고 시작한다. 기준 스펙은 `openspec/specs/`이고, 기존 요구사항을 바꾸면 delta에 MODIFIED/REMOVED로 그 요구사항을 직접 가리킨다. 말없이 반대로 구현하지 않는다.
  4. 범위는 스펙이 정한다. 스펙에 없는 동작, 옵션, 화면을 추가하지 않는다. 필요하면 스펙을 먼저 고친다.
  5. 완료는 PR CI와 같은 명령으로 판정한다. 검사를 통과시키려고 설정을 끄거나 테스트를 지우지 않는다.

  사람에게 묻기 (clarify, 승인, test-writer 질문 모두)
  - 그 자리에서 묻는다. Claude는 AskUserQuestion, Codex는 대화로 묻는다. AskUserQuestion은 한 번에 4개까지라서 그보다 많으면 나눠 묻고, 하나도 빠뜨리지 않는다.
  - 질문마다 고를 수 있는 답과 권하는 답을 보여 준다. 사람이 고를 수 있도록 질문만 읽어도 뜻이 통하게 쓴다.
  - 답 대신 되묻는 말("그게 무슨 뜻이야?")이 오면 답으로 적지 않는다. 설명한 뒤 같은 질문을 다시 묻는다.
  - 답을 미루면 `**답**: 보류 — <이유와 언제 정할지>`로 적는다. 빈 칸으로 두지 않는다.
  - 답을 받지 못한 질문은 `**답**:` 줄을 비워 둔다. 다음 `sdd-next`가 남은 질문만 다시 묻는다.
  - 사람의 답 없이 스스로 답을 정하지 않는다.

  앞 단계로 돌아가기
  - 지금 단계에서 앞 단계 산출물(proposal, delta 스펙, plan)을 고쳐야 한다고 판단하면 고치지 말고 멈춘다. 어느 단계로 왜 돌아가야 하는지 사람에게 알리고 묻는다.
  - 동의하면 그 산출물만 고친다(delta를 고쳤으면 `openspec validate <change> --strict`를 통과시킨다). 뒤 단계는 손대지 않는다.
  - 뒤 단계 산출물에 적힌 해시(`spec-hash:`, `x-approved:`, `plan-hash:`)가 달라지므로, 다음 `sdd-next`부터 상태 판정이 고친 곳 바로 다음 단계로 돌아가 차례대로 다시 진행한다.

  요구사항 ID
  - 도메인 코드는 영어 대문자 2~6자로 기능 영역을 나타낸다(예: AGENT, TRAY). capability 경로는 그 소문자다.
  - 기능 요구사항(Functional Requirement)은 `FR-<도메인>-NNN`, 성공 기준(Success Criteria)은 `SC-<도메인>-NNN`이다.
  - 한 번 쓴 ID는 지워진 뒤에도 다시 쓰지 않는다.

rules:
  proposal:
    - 'Capabilities의 capability 경로는 도메인 코드의 소문자로 쓴다.'
  specs:
    - '모든 요구사항 제목은 `### Requirement: FR-<도메인>-NNN <이름>` 또는 `### Requirement: SC-<도메인>-NNN <이름>` 형식이다.'
    - 'SC 요구사항은 수치나 관찰 가능한 조건으로 측정할 수 있어야 한다.'
  plan:
    - '작업 체크박스마다 관련 FR-/SC- ID를 적는다. ID가 없는 작업은 넣지 않는다.'
    - '설계의 층 배치는 `AGENTS.md` "폴더 구조"와 같아야 한다.'

operations:
  archive:
    guidance:
      - 'archive는 기능 PR을 머지하기 전에 같은 브랜치에서 한다.'
      - '`node scripts/sdd-state.mjs <change>`의 state가 archive일 때만 한다.'
