schema_version: "1.0"

preset:
  id: "namaste"
  name: "Namaste World"
  version: "1.0.0"
  description: "namaste-world 저장소 규칙(code-writer, fp-apply, AGENTS.md)에 맞춘 spec, plan, tasks 템플릿과 명령 보강"
  author: "namaste-world"
  repository: "https://github.com/Go-bugi/namaste-world"
  license: "UNLICENSED"

requires:
  speckit_version: ">=1.2.3"

provides:
  templates:
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Domain, Touches 필드와 FR-<도메인>-NNN ID, 테스트 가능한 문장 규칙"
      replaces: "spec-template"

    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "code-writer 0~2단계 결과(Layers & Skills, Core Model)를 쓰는 plan"
      replaces: "plan-template"

    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "code-writer 단계 순서(모델링, 테스트, core, shell, 검증)로 나눈 tasks"
      replaces: "tasks-template"

    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "기존 memory와 context.md를 읽고 쓰게 하는 보강"
      strategy: "append"

    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "code-writer 0~2단계와 contracts 작성 보강"
      strategy: "append"

    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "code-writer 단계 순서와 층 표시 보강"
      strategy: "append"

    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "작업마다 code-writer 4~5단계를 적용하고 테스트 파일을 고치지 않게 하는 보강"
      strategy: "append"

tags:
  - "project"
